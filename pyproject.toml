[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanad-support-rag"
version = "0.3.0"
description = "Production bilingual multi-agent RAG assistant with LangGraph, Qdrant, vLLM, Kubernetes, and Langfuse/LangSmith tracing."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohamed Eissa" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
  "langgraph>=1.0",
  "qdrant-client>=1.15",
]

[project.optional-dependencies]
tracing = ["langfuse>=4.0"]
eval = ["ragas>=0.4", "openai>=1.0"]
dev = ["pytest>=8", "ragas>=0.4", "openai>=1.0", "langfuse>=4.0"]

[project.scripts]
sanad = "sanad.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sanad*", "mock_backend*"]

[tool.setuptools.package-data]
sanad = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
