[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanad-support-rag"
version = "0.1.0"
description = "Local bilingual (Arabic/English) RAG customer-support assistant with citations, human handoff and backend tools, powered by Ollama."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohamed Eissa" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sanad = "sanad.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sanad*", "mock_backend*"]

[tool.setuptools.package-data]
sanad = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
