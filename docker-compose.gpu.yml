# Production GPU stack: vLLM (fine-tuned QLoRA LoRA adapter) + Qdrant + Ollama (bge-m3) + mock backend + Sanad + optional Langfuse.
# Usage:
#   docker compose -f docker-compose.gpu.yml up --build
#   docker compose -f docker-compose.gpu.yml --profile langfuse up --build
services:
  vllm:
    build:
      context: ./deploy/vllm
    ports: ["8002:8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      VLLM_LORA_MODULES: ${VLLM_LORA_MODULES:-sanad-qwen25-ft=3isa2002/qwen2.5-7b-sanad-arabic-qlora}
      VLLM_QUANTIZATION: ${VLLM_QUANTIZATION:-bitsandbytes}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-2048}
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.88}
    volumes: ["hf-cache:/root/.cache/huggingface"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  ollama-pull-embed:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${SANAD_EMBED_MODEL:-bge-m3}"]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  mock-backend:
    build: .
    command: ["python", "-m", "mock_backend"]
    environment:
      MOCK_BACKEND_HOST: 0.0.0.0
      MOCK_BACKEND_PORT: "8001"
      MOCK_BACKEND_DATA: /app/data/mock_backend
      MOCK_BACKEND_API_KEY: ${SANAD_BACKEND_API_KEY:-change-me}
    ports: ["8001:8001"]

  sanad:
    build: .
    depends_on:
      vllm:
        condition: service_healthy
      ollama-pull-embed:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      mock-backend:
        condition: service_started
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SANAD_EMBEDDER: ${SANAD_EMBEDDER:-ollama}
      SANAD_EMBED_MODEL: ${SANAD_EMBED_MODEL:-bge-m3}
      SANAD_LLM: vllm
      SANAD_VLLM_BASE_URL: http://vllm:8000/v1
      SANAD_VLLM_MODEL: ${SANAD_VLLM_MODEL:-sanad-qwen25-ft}
      SANAD_VECTOR_BACKEND: qdrant
      SANAD_QDRANT_URL: http://qdrant:6333
      SANAD_TRACING: ${SANAD_TRACING:-jsonl}
      SANAD_TRACE_PATH: /app/state/traces.jsonl
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse:3000}
      SANAD_BACKEND_URL: http://mock-backend:8001
      SANAD_BACKEND_API_KEY: ${SANAD_BACKEND_API_KEY:-change-me}
      SANAD_ADMIN_TOKEN: ${SANAD_ADMIN_TOKEN:-change-me}
      SANAD_INDEX_DIR: /app/state/index
      SANAD_DB_PATH: /app/state/sanad.db
    volumes: ["sanad-state:/app/state"]
    ports: ["8000:8000"]

  langfuse-postgres:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASS:-langfuse}
      POSTGRES_DB: langfuse
    volumes: ["langfuse-pg:/var/lib/postgresql/data"]

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["langfuse"]
    depends_on: [langfuse-postgres]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_PG_PASS:-langfuse}@langfuse-postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-nextauth-secret}
      SALT: ${LANGFUSE_SALT:-change-me-salt}
      NEXTAUTH_URL: http://localhost:3000

volumes:
  hf-cache:
  ollama:
  qdrant-data:
  sanad-state:
  langfuse-pg:
