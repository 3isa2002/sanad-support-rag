# Local CPU/Kind/Docker-Desktop Kubernetes overlay (runs Qdrant + mock-backend + Sanad offline mode without requiring an NVIDIA K8s GPU plugin).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sanad
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: sanad-config
    patch: |-
      - op: replace
        path: /data/SANAD_EMBEDDER
        value: "hash"
      - op: replace
        path: /data/SANAD_LLM
        value: "fake"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vllm-qwen
        namespace: sanad
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: vllm-svc
        namespace: sanad
      $patch: delete
